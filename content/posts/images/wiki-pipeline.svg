<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Alibaba PuHuiTi,Heiti SC,Arial Unicode MS,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1100" height="640" fill="#fafaf7"/>
  <text x="550" y="34" font-size="19" font-weight="700" text-anchor="middle" fill="#1a202c">Wiki 生产链路：从 Inbox 到结构化知识库</text>
  <text x="550" y="54" font-size="12" text-anchor="middle" fill="#718096">多源收敛 → LLM 抽取 → 索引同步 → 知识图谱自然生长</text>

  <!-- ===== 多源入口 ===== -->
  <g>
    <text x="40" y="100" font-size="14" font-weight="700" fill="#1e3a8a">多源入口</text>
    <rect x="40" y="110" width="150" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="115" y="138" font-size="12" text-anchor="middle" fill="#1e3a8a">PDF 上传 / URL</text>

    <rect x="40" y="162" width="150" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="115" y="190" font-size="12" text-anchor="middle" fill="#1e3a8a">Chrome 插件剪藏</text>

    <rect x="40" y="214" width="150" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="115" y="242" font-size="12" text-anchor="middle" fill="#1e3a8a">RSS 订阅</text>

    <rect x="40" y="266" width="150" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="115" y="294" font-size="12" text-anchor="middle" fill="#1e3a8a">Blog 索引页</text>

    <rect x="40" y="318" width="150" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="115" y="346" font-size="12" text-anchor="middle" fill="#1e3a8a">Newsletter IMAP</text>
  </g>

  <!-- 箭头到 inbox -->
  <path d="M190 132 L240 170" stroke="#2563eb" stroke-width="1.3" fill="none" marker-end="url(#arrB)"/>
  <path d="M190 184 L240 185" stroke="#2563eb" stroke-width="1.3" fill="none" marker-end="url(#arrB)"/>
  <path d="M190 236 L240 210" stroke="#2563eb" stroke-width="1.3" fill="none" marker-end="url(#arrB)"/>
  <path d="M190 288 L240 225" stroke="#2563eb" stroke-width="1.3" fill="none" marker-end="url(#arrB)"/>
  <path d="M190 340 L240 240" stroke="#2563eb" stroke-width="1.3" fill="none" marker-end="url(#arrB)"/>

  <!-- ===== Inbox (raw/) ===== -->
  <g>
    <rect x="240" y="150" width="200" height="120" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="340" y="178" font-size="14" font-weight="700" text-anchor="middle" fill="#78350f">Inbox (status: inbox)</text>
    <text x="250" y="202" font-size="11" fill="#92400e">raw/papers/&lt;slug&gt;/paper.pdf</text>
    <text x="250" y="220" font-size="11" fill="#92400e">raw/web/&lt;slug&gt;.html + .md</text>
    <text x="250" y="238" font-size="11" fill="#92400e">raw/rss/&lt;feed&gt;/&lt;slug&gt;.md</text>
    <text x="250" y="256" font-size="11" fill="#92400e">raw/newsletter/&lt;sender&gt;/&lt;slug&gt;.md</text>
  </g>

  <!-- ===== LLM Extract ===== -->
  <g>
    <rect x="240" y="290" width="200" height="86" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="340" y="315" font-size="13" font-weight="700" text-anchor="middle" fill="#78350f">LLM Extract (可选)</text>
    <text x="250" y="338" font-size="11" fill="#92400e">pdftoppm → 每页 PNG</text>
    <text x="250" y="356" font-size="11" fill="#92400e">claude sonnet: 图片→Markdown</text>
    <text x="250" y="374" font-size="11" fill="#92400e">保留表格 / 公式 / 图片描述</text>
  </g>
  <path d="M340 270 L340 290" stroke="#d97706" stroke-width="1.3" fill="none" marker-end="url(#arrO)"/>

  <!-- ===== Publish ===== -->
  <g>
    <rect x="470" y="170" width="160" height="78" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="550" y="198" font-size="13" font-weight="700" text-anchor="middle" fill="#5b21b6">Publish 触发</text>
    <text x="480" y="220" font-size="11" fill="#6d28d9">status: inbox → published</text>
    <text x="480" y="238" font-size="11" fill="#6d28d9">goroutine 调 Ingest Pipeline</text>
  </g>
  <path d="M440 210 L470 210" stroke="#7c3aed" stroke-width="1.4" fill="none" marker-end="url(#arrV)"/>
  <path d="M410 320 L470 240" stroke="#d97706" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)"/>

  <!-- ===== Ingest Prompt (核心) ===== -->
  <g>
    <rect x="650" y="90" width="420" height="200" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
    <text x="670" y="116" font-size="14" font-weight="700" fill="#78350f">Ingest Prompt (模板渲染)</text>
    <text x="670" y="138" font-size="11" fill="#92400e">claude -p --allowedTools Read,Write,Edit,Glob,Grep</text>
    <text x="670" y="160" font-size="11" fill="#374151">任务: 读取 {{RawPath}}，生成四类 wiki 文件</text>
    <text x="670" y="180" font-size="11" fill="#374151">① sources/{{Name}}.md — 源文档摘要页</text>
    <text x="670" y="198" font-size="11" fill="#374151">② entities/* — 实体页 (人/公司/项目/技术)</text>
    <text x="670" y="216" font-size="11" fill="#374151">③ topics/* — 主题页 (问题/突破/证据)</text>
    <text x="670" y="234" font-size="11" fill="#374151">④ log.md — 追加 YYYY-MM-DD 操作日志</text>
    <text x="670" y="258" font-size="10" font-style="italic" fill="#78350f">Claude 用 Read 读取源文档，用 Write/Edit 写入 wiki/</text>
    <text x="670" y="275" font-size="10" font-style="italic" fill="#78350f">每个条目带 frontmatter: name / description / type</text>
  </g>
  <path d="M630 200 L650 200" stroke="#d97706" stroke-width="1.4" fill="none" marker-end="url(#arrO)"/>

  <!-- ===== Wiki 产物 ===== -->
  <g>
    <rect x="650" y="310" width="420" height="170" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="670" y="336" font-size="14" font-weight="700" fill="#14532d">Wiki 产物 (users/&lt;id&gt;/wiki/)</text>

    <text x="670" y="360" font-size="11" fill="#166534">index.md ← 自动同步 (sources + entities + topics)</text>
    <text x="670" y="378" font-size="11" fill="#166534">sources.md ← 源文档列表 (按字母排序)</text>
    <text x="670" y="396" font-size="11" fill="#166534">entities.md ← 实体列表</text>
    <text x="670" y="414" font-size="11" fill="#166534">topics.md ← 主题列表</text>
    <text x="670" y="432" font-size="11" fill="#166534">log.md ← Claude 每次 ingest 追加</text>
    <text x="670" y="456" font-size="11" fill="#14532d" font-weight="600">sources/*.md · entities/*.md · topics/*.md</text>
    <text x="670" y="472" font-size="10" fill="#166534">带 frontmatter · 互相通过 Relative 链接引用</text>
  </g>
  <path d="M860 290 L860 310" stroke="#16a34a" stroke-width="1.4" fill="none" marker-end="url(#arrG)"/>

  <!-- ===== Sync Index ===== -->
  <g>
    <rect x="470" y="340" width="160" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="550" y="365" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">SyncIndexFiles</text>
    <text x="480" y="385" font-size="10" fill="#166534">扫描子目录</text>
    <text x="480" y="400" font-size="10" fill="#166534">parseFrontmatter()</text>
    <text x="480" y="415" font-size="10" fill="#166534">按字母排序</text>
    <text x="480" y="430" font-size="10" fill="#166534">encodeMarkdownPath</text>
  </g>
  <path d="M630 390 L650 390" stroke="#16a34a" stroke-width="1.3" fill="none" marker-end="url(#arrG)"/>

  <!-- ===== 用户消费 ===== -->
  <g>
    <text x="40" y="430" font-size="14" font-weight="700" fill="#334155">用户消费</text>
    <rect x="40" y="445" width="170" height="70" rx="8" fill="#fff" stroke="#cbd5e0"/>
    <text x="125" y="470" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">Wiki 视图</text>
    <text x="50" y="490" font-size="10" fill="#475569">/wiki/* 路由</text>
    <text x="50" y="505" font-size="10" fill="#475569">[[link]] 双向链接解析</text>

    <rect x="40" y="525" width="170" height="70" rx="8" fill="#fff" stroke="#cbd5e0"/>
    <text x="125" y="550" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">知识库问答</text>
    <text x="50" y="570" font-size="10" fill="#475569">Claude 用 Read/Glob/Grep/LS</text>
    <text x="50" y="585" font-size="10" fill="#475569">在 wiki/ 自主探索回答</text>

    <rect x="240" y="525" width="170" height="70" rx="8" fill="#fff" stroke="#cbd5e0"/>
    <text x="325" y="550" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">文档对话</text>
    <text x="250" y="570" font-size="10" fill="#475569">Read 源文档 + wiki/sources/*</text>
    <text x="250" y="585" font-size="10" fill="#475569">--resume 多轮</text>

    <rect x="440" y="525" width="170" height="70" rx="8" fill="#fff" stroke="#cbd5e0"/>
    <text x="525" y="550" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">PDF 双语对比</text>
    <text x="450" y="570" font-size="10" fill="#475569">pdf2zh → 译文 PDF</text>
    <text x="450" y="585" font-size="10" fill="#475569">pdfjs-dist 左右分屏</text>

    <rect x="640" y="525" width="170" height="70" rx="8" fill="#fff" stroke="#cbd5e0"/>
    <text x="725" y="550" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">Doc Notes</text>
    <text x="650" y="570" font-size="10" fill="#475569">阅读时随手记笔记</text>
    <text x="650" y="585" font-size="10" fill="#475569">可反向 push 到 wiki</text>

    <rect x="840" y="525" width="230" height="70" rx="8" fill="#fff" stroke="#cbd5e0"/>
    <text x="955" y="550" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">标签聚合</text>
    <text x="850" y="570" font-size="10" fill="#475569">多对多 document_tags 关联</text>
    <text x="850" y="585" font-size="10" fill="#475569">按标签/主题浏览</text>
  </g>

  <!-- 连接 wiki 到用户消费 -->
  <path d="M670 480 L125 525" stroke="#4a5568" stroke-width="1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <path d="M750 480 L125 525" stroke="#4a5568" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <path d="M860 480 L325 525" stroke="#4a5568" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <path d="M860 480 L525 525" stroke="#4a5568" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <path d="M860 480 L725 525" stroke="#4a5568" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <path d="M950 480 L955 525" stroke="#4a5568" stroke-width="1" fill="none" stroke-dasharray="3,3"/>

  <!-- ===== 关键设计要点 ===== -->
  <g>
    <text x="240" y="410" font-size="12" font-weight="600" fill="#334155">核心设计：LLM 不是翻译器，而是知识库维护者</text>
    <text x="240" y="428" font-size="10" fill="#475569">它读源文档、写 wiki 文件、更新实体和主题页、追加日志，让知识图谱随阅读自然生长</text>
  </g>
</svg>
