<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="720" fill="#fafaf7"/>

  <!-- Title -->
  <text x="550" y="36" font-size="20" font-weight="700" text-anchor="middle" fill="#1a202c">LLM Knowledge — Overall Architecture</text>
  <text x="550" y="58" font-size="13" text-anchor="middle" fill="#718096">Self-hosted · Single binary · Claude CLI driven</text>

  <!-- ============ Clients (top) ============ -->
  <g>
    <!-- Browser / Web -->
    <rect x="120" y="100" width="140" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="190" y="130" font-size="14" font-weight="600" text-anchor="middle" fill="#1e3a8a">Browser</text>
    <text x="190" y="150" font-size="11" text-anchor="middle" fill="#1e40af">Web UI · PDF reader</text>
    <text x="190" y="165" font-size="11" text-anchor="middle" fill="#1e40af">Doc chat · KB Q&amp;A</text>

    <!-- Chrome Extension -->
    <rect x="290" y="100" width="140" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="360" y="130" font-size="14" font-weight="600" text-anchor="middle" fill="#1e3a8a">Chrome Extension</text>
    <text x="360" y="150" font-size="11" text-anchor="middle" fill="#1e40af">One-click web clip</text>
    <text x="360" y="165" font-size="11" text-anchor="middle" fill="#1e40af">Chromium-based</text>

    <!-- Mobile -->
    <rect x="460" y="100" width="140" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="530" y="130" font-size="14" font-weight="600" text-anchor="middle" fill="#1e3a8a">Mobile</text>
    <text x="530" y="150" font-size="11" text-anchor="middle" fill="#1e40af">Responsive shell</text>
    <text x="530" y="165" font-size="11" text-anchor="middle" fill="#1e40af">Bottom-drawer chat</text>

    <!-- i18n badge -->
    <rect x="630" y="110" width="100" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
    <text x="680" y="132" font-size="12" font-weight="600" text-anchor="middle" fill="#166534">Bilingual UI</text>
    <text x="680" y="148" font-size="10" text-anchor="middle" fill="#15803d">EN / ZH toggle</text>
  </g>

  <!-- Arrow from clients to Backend -->
  <path d="M190 170 L190 220" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M360 170 L360 220" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M530 170 L530 220" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="195" y="200" font-size="10" fill="#475569">HTTP</text>
  <text x="365" y="200" font-size="10" fill="#475569">Clip API</text>
  <text x="535" y="200" font-size="10" fill="#475569">SSE</text>

  <!-- ============ Backend (middle) ============ -->
  <g>
    <rect x="80" y="225" width="830" height="195" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="100" y="250" font-size="15" font-weight="700" fill="#78350f">Go Backend (Echo + GORM)</text>
    <text x="490" y="250" font-size="11" fill="#92400e">Single binary with embedded frontend dist</text>

    <!-- Module boxes -->
    <rect x="100" y="265" width="130" height="52" rx="7" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="165" y="286" font-size="12" font-weight="600" text-anchor="middle" fill="#78350f">REST API</text>
    <text x="165" y="304" font-size="10" text-anchor="middle" fill="#92400e">Docs / tags / sessions</text>

    <rect x="245" y="265" width="130" height="52" rx="7" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="310" y="286" font-size="12" font-weight="600" text-anchor="middle" fill="#78350f">SSE Stream</text>
    <text x="310" y="304" font-size="10" text-anchor="middle" fill="#92400e">Chat / translate / extract</text>

    <rect x="390" y="265" width="130" height="52" rx="7" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="455" y="286" font-size="12" font-weight="600" text-anchor="middle" fill="#78350f">Auth Middleware</text>
    <text x="455" y="304" font-size="10" text-anchor="middle" fill="#92400e">Token · user isolation</text>

    <rect x="535" y="265" width="130" height="52" rx="7" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="600" y="286" font-size="12" font-weight="600" text-anchor="middle" fill="#78350f">Session Pool</text>
    <text x="600" y="304" font-size="10" text-anchor="middle" fill="#92400e">--resume · concurrency</text>

    <rect x="680" y="265" width="130" height="52" rx="7" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="745" y="286" font-size="12" font-weight="600" text-anchor="middle" fill="#78350f">Headless Browser Pool</text>
    <text x="745" y="304" font-size="10" text-anchor="middle" fill="#92400e">SPA / JS rendering</text>

    <!-- Second row -->
    <rect x="100" y="330" width="130" height="52" rx="7" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="165" y="351" font-size="12" font-weight="600" text-anchor="middle" fill="#78350f">RSS Scheduler</text>
    <text x="165" y="369" font-size="10" text-anchor="middle" fill="#92400e">Auto sync + dedupe</text>

    <rect x="245" y="330" width="130" height="52" rx="7" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="310" y="351" font-size="12" font-weight="600" text-anchor="middle" fill="#78350f">Blog Subscription</text>
    <text x="310" y="369" font-size="10" text-anchor="middle" fill="#92400e">Index-page fetch</text>

    <rect x="390" y="330" width="130" height="52" rx="7" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="455" y="351" font-size="12" font-weight="600" text-anchor="middle" fill="#78350f">Newsletter IMAP</text>
    <text x="455" y="369" font-size="10" text-anchor="middle" fill="#92400e">Mail pull · cleanup</text>

    <rect x="535" y="330" width="130" height="52" rx="7" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="600" y="351" font-size="12" font-weight="600" text-anchor="middle" fill="#78350f">pdf2zh Translator</text>
    <text x="600" y="369" font-size="10" text-anchor="middle" fill="#92400e">OpenAI-compatible</text>

    <rect x="680" y="330" width="130" height="52" rx="7" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="745" y="351" font-size="12" font-weight="600" text-anchor="middle" fill="#78350f">Wiki Organizer</text>
    <text x="745" y="369" font-size="10" text-anchor="middle" fill="#92400e">Tags · entities · topics</text>

    <!-- Footer -->
    <text x="100" y="408" font-size="11" fill="#92400e">Port: 9999 · Data dir: ~/.llm-knowledge · Graceful shutdown · Per-user partition</text>
  </g>

  <!-- ============ Right side: Claude CLI ============ -->
  <g>
    <rect x="940" y="260" width="140" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="1010" y="290" font-size="14" font-weight="700" text-anchor="middle" fill="#5b21b6">Claude CLI</text>
    <text x="1010" y="312" font-size="11" text-anchor="middle" fill="#6d28d9">claude code</text>
    <text x="1010" y="328" font-size="11" text-anchor="middle" fill="#6d28d9">Summarize · extract · Q&amp;A</text>
    <text x="1010" y="344" font-size="11" text-anchor="middle" fill="#6d28d9">Structured output</text>
    <text x="1010" y="360" font-size="10" font-style="italic" text-anchor="middle" fill="#7c3aed">--resume / --output-format</text>
  </g>
  <path d="M910 310 L940 310" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <path d="M940 330 L910 330" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,3"/>

  <!-- ============ Data sources (bottom-left) ============ -->
  <g>
    <text x="140" y="475" font-size="14" font-weight="700" fill="#334155">Data sources</text>
    <rect x="40" y="490" width="120" height="44" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="100" y="517" font-size="12" text-anchor="middle" fill="#3730a3">PDF files</text>

    <rect x="170" y="490" width="120" height="44" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="230" y="517" font-size="12" text-anchor="middle" fill="#3730a3">Web clips</text>

    <rect x="300" y="490" width="120" height="44" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="360" y="517" font-size="12" text-anchor="middle" fill="#3730a3">RSS feeds</text>

    <rect x="430" y="490" width="120" height="44" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="490" y="517" font-size="12" text-anchor="middle" fill="#3730a3">Blog subscriptions</text>

    <rect x="560" y="490" width="120" height="44" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="620" y="517" font-size="12" text-anchor="middle" fill="#3730a3">Newsletter IMAP</text>
  </g>
  <!-- Arrow up into backend -->
  <path d="M360 490 L455 420" stroke="#6366f1" stroke-width="1.3" fill="none" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- ============ Storage (bottom) ============ -->
  <g>
    <rect x="730" y="475" width="200" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="830" y="500" font-size="14" font-weight="700" text-anchor="middle" fill="#14532d">Persistent storage</text>
    <text x="745" y="522" font-size="11" fill="#166534">• SQLite: metadata / sessions</text>
    <text x="745" y="540" font-size="11" fill="#166534">• raw/: originals + Markdown</text>
    <text x="745" y="558" font-size="11" fill="#166534">• wiki/: extracted structure</text>
  </g>
  <path d="M830 475 L830 420" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ Bottom legend ============ -->
  <g>
    <text x="40" y="620" font-size="13" font-weight="700" fill="#334155">Key data flows</text>

    <line x1="40" y1="640" x2="80" y2="640" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <text x="90" y="644" font-size="11" fill="#475569">User requests (HTTP / SSE)</text>

    <line x1="40" y1="662" x2="80" y2="662" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
    <text x="90" y="666" font-size="11" fill="#475569">Claude CLI subprocess calls</text>

    <line x1="40" y1="684" x2="80" y2="684" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="90" y="688" font-size="11" fill="#475569">Multi-source content ingest</text>

    <line x1="40" y1="706" x2="80" y2="706" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="90" y="710" font-size="11" fill="#475569">Persistence (SQLite + file system)</text>
  </g>

  <!-- Workflow box -->
  <g>
    <rect x="300" y="608" width="740" height="100" rx="10" fill="#fff" stroke="#cbd5e0" stroke-dasharray="4,3"/>
    <text x="320" y="628" font-size="12" font-weight="700" fill="#334155">Typical workflow</text>
    <text x="320" y="650" font-size="11" fill="#475569">1. User clips a web page via the extension → original saved to raw/, status set to inbox</text>
    <text x="320" y="670" font-size="11" fill="#475569">2. Backend invokes Claude CLI to extract structure, produce a summary, and translate EN↔ZH</text>
    <text x="320" y="690" font-size="11" fill="#475569">3. User chats with the document, or queries the knowledge base across multiple sources</text>
    <text x="320" y="710" font-size="11" fill="#475569">4. Curated content is published to the wiki, organized by tags and topics, searchable</text>
  </g>
</svg>
