<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1100" height="640" fill="#fafaf7"/>
  <text x="550" y="34" font-size="19" font-weight="700" text-anchor="middle" fill="#1a202c">Wiki Production Pipeline: From Inbox to Structured Knowledge Base</text>
  <text x="550" y="54" font-size="12" text-anchor="middle" fill="#718096">Multi-source ingest → LLM extraction → index sync → knowledge graph grows organically</text>

  <!-- ===== Multi-source entry ===== -->
  <g>
    <text x="40" y="100" font-size="14" font-weight="700" fill="#1e3a8a">Sources</text>
    <rect x="40" y="110" width="150" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="115" y="138" font-size="12" text-anchor="middle" fill="#1e3a8a">PDF upload / URL</text>

    <rect x="40" y="162" width="150" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="115" y="190" font-size="12" text-anchor="middle" fill="#1e3a8a">Chrome extension clip</text>

    <rect x="40" y="214" width="150" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="115" y="242" font-size="12" text-anchor="middle" fill="#1e3a8a">RSS subscription</text>

    <rect x="40" y="266" width="150" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="115" y="294" font-size="12" text-anchor="middle" fill="#1e3a8a">Blog index page</text>

    <rect x="40" y="318" width="150" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="115" y="346" font-size="12" text-anchor="middle" fill="#1e3a8a">Newsletter IMAP</text>
  </g>

  <!-- Arrows into inbox -->
  <path d="M190 132 L240 170" stroke="#2563eb" stroke-width="1.3" fill="none" marker-end="url(#arrB)"/>
  <path d="M190 184 L240 185" stroke="#2563eb" stroke-width="1.3" fill="none" marker-end="url(#arrB)"/>
  <path d="M190 236 L240 210" stroke="#2563eb" stroke-width="1.3" fill="none" marker-end="url(#arrB)"/>
  <path d="M190 288 L240 225" stroke="#2563eb" stroke-width="1.3" fill="none" marker-end="url(#arrB)"/>
  <path d="M190 340 L240 240" stroke="#2563eb" stroke-width="1.3" fill="none" marker-end="url(#arrB)"/>

  <!-- ===== Inbox (raw/) ===== -->
  <g>
    <rect x="240" y="150" width="200" height="120" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="340" y="178" font-size="14" font-weight="700" text-anchor="middle" fill="#78350f">Inbox (status: inbox)</text>
    <text x="250" y="202" font-size="11" fill="#92400e">raw/papers/&lt;slug&gt;/paper.pdf</text>
    <text x="250" y="220" font-size="11" fill="#92400e">raw/web/&lt;slug&gt;.html + .md</text>
    <text x="250" y="238" font-size="11" fill="#92400e">raw/rss/&lt;feed&gt;/&lt;slug&gt;.md</text>
    <text x="250" y="256" font-size="11" fill="#92400e">raw/newsletter/&lt;sender&gt;/&lt;slug&gt;.md</text>
  </g>

  <!-- ===== LLM Extract ===== -->
  <g>
    <rect x="240" y="290" width="200" height="86" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="340" y="315" font-size="13" font-weight="700" text-anchor="middle" fill="#78350f">LLM Extract (optional)</text>
    <text x="250" y="338" font-size="11" fill="#92400e">pdftoppm → PNG per page</text>
    <text x="250" y="356" font-size="11" fill="#92400e">claude sonnet: image → Markdown</text>
    <text x="250" y="374" font-size="11" fill="#92400e">Preserves tables / formulas / image captions</text>
  </g>
  <path d="M340 270 L340 290" stroke="#d97706" stroke-width="1.3" fill="none" marker-end="url(#arrO)"/>

  <!-- ===== Publish ===== -->
  <g>
    <rect x="470" y="170" width="160" height="78" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="550" y="198" font-size="13" font-weight="700" text-anchor="middle" fill="#5b21b6">Publish triggers</text>
    <text x="480" y="220" font-size="11" fill="#6d28d9">status: inbox → published</text>
    <text x="480" y="238" font-size="11" fill="#6d28d9">goroutine calls Ingest Pipeline</text>
  </g>
  <path d="M440 210 L470 210" stroke="#7c3aed" stroke-width="1.4" fill="none" marker-end="url(#arrV)"/>
  <path d="M410 320 L470 240" stroke="#d97706" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)"/>

  <!-- ===== Ingest Prompt (core) ===== -->
  <g>
    <rect x="650" y="90" width="420" height="200" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
    <text x="670" y="116" font-size="14" font-weight="700" fill="#78350f">Ingest Prompt (template-rendered)</text>
    <text x="670" y="138" font-size="11" fill="#92400e">claude -p --allowedTools Read,Write,Edit,Glob,Grep</text>
    <text x="670" y="160" font-size="11" fill="#374151">Task: read {{RawPath}}, produce four kinds of wiki files</text>
    <text x="670" y="180" font-size="11" fill="#374151">① sources/{{Name}}.md — source summary page</text>
    <text x="670" y="198" font-size="11" fill="#374151">② entities/* — entity pages (people / companies / projects / tech)</text>
    <text x="670" y="216" font-size="11" fill="#374151">③ topics/* — topic pages (problem / breakthrough / evidence)</text>
    <text x="670" y="234" font-size="11" fill="#374151">④ log.md — append YYYY-MM-DD operation log</text>
    <text x="670" y="258" font-size="10" font-style="italic" fill="#78350f">Claude uses Read to consume the source, Write/Edit to commit to wiki/</text>
    <text x="670" y="275" font-size="10" font-style="italic" fill="#78350f">Every entry carries frontmatter: name / description / type</text>
  </g>
  <path d="M630 200 L650 200" stroke="#d97706" stroke-width="1.4" fill="none" marker-end="url(#arrO)"/>

  <!-- ===== Wiki outputs ===== -->
  <g>
    <rect x="650" y="310" width="420" height="170" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="670" y="336" font-size="14" font-weight="700" fill="#14532d">Wiki outputs (users/&lt;id&gt;/wiki/)</text>

    <text x="670" y="360" font-size="11" fill="#166534">index.md ← auto-synced (sources + entities + topics)</text>
    <text x="670" y="378" font-size="11" fill="#166534">sources.md ← source list (alphabetical)</text>
    <text x="670" y="396" font-size="11" fill="#166534">entities.md ← entity list</text>
    <text x="670" y="414" font-size="11" fill="#166534">topics.md ← topic list</text>
    <text x="670" y="432" font-size="11" fill="#166534">log.md ← Claude appends on every ingest</text>
    <text x="670" y="456" font-size="11" fill="#14532d" font-weight="600">sources/*.md · entities/*.md · topics/*.md</text>
    <text x="670" y="472" font-size="10" fill="#166534">With frontmatter · cross-linked via relative paths</text>
  </g>
  <path d="M860 290 L860 310" stroke="#16a34a" stroke-width="1.4" fill="none" marker-end="url(#arrG)"/>

  <!-- ===== Sync Index ===== -->
  <g>
    <rect x="470" y="340" width="160" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="550" y="365" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">SyncIndexFiles</text>
    <text x="480" y="385" font-size="10" fill="#166534">Scans subdirectories</text>
    <text x="480" y="400" font-size="10" fill="#166534">parseFrontmatter()</text>
    <text x="480" y="415" font-size="10" fill="#166534">Alphabetical sort</text>
    <text x="480" y="430" font-size="10" fill="#166534">encodeMarkdownPath</text>
  </g>
  <path d="M630 390 L650 390" stroke="#16a34a" stroke-width="1.3" fill="none" marker-end="url(#arrG)"/>

  <!-- ===== User consumption ===== -->
  <g>
    <text x="40" y="430" font-size="14" font-weight="700" fill="#334155">Consumed by</text>
    <rect x="40" y="445" width="170" height="70" rx="8" fill="#fff" stroke="#cbd5e0"/>
    <text x="125" y="470" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">Wiki view</text>
    <text x="50" y="490" font-size="10" fill="#475569">/wiki/* route</text>
    <text x="50" y="505" font-size="10" fill="#475569">[[link]] bidirectional links</text>

    <rect x="40" y="525" width="170" height="70" rx="8" fill="#fff" stroke="#cbd5e0"/>
    <text x="125" y="550" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">Wiki Chat</text>
    <text x="50" y="570" font-size="10" fill="#475569">Claude uses Read/Glob/Grep/LS</text>
    <text x="50" y="585" font-size="10" fill="#475569">to explore wiki/ autonomously</text>

    <rect x="240" y="525" width="170" height="70" rx="8" fill="#fff" stroke="#cbd5e0"/>
    <text x="325" y="550" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">Doc Chat</text>
    <text x="250" y="570" font-size="10" fill="#475569">Read source + wiki/sources/*</text>
    <text x="250" y="585" font-size="10" fill="#475569">--resume for multi-turn</text>

    <rect x="440" y="525" width="170" height="70" rx="8" fill="#fff" stroke="#cbd5e0"/>
    <text x="525" y="550" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">Bilingual PDF</text>
    <text x="450" y="570" font-size="10" fill="#475569">pdf2zh → translated PDF</text>
    <text x="450" y="585" font-size="10" fill="#475569">pdfjs-dist side-by-side</text>

    <rect x="640" y="525" width="170" height="70" rx="8" fill="#fff" stroke="#cbd5e0"/>
    <text x="725" y="550" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">Doc Notes</text>
    <text x="650" y="570" font-size="10" fill="#475569">Take notes while reading</text>
    <text x="650" y="585" font-size="10" fill="#475569">Can push back to wiki</text>

    <rect x="840" y="525" width="230" height="70" rx="8" fill="#fff" stroke="#cbd5e0"/>
    <text x="955" y="550" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">Tag aggregation</text>
    <text x="850" y="570" font-size="10" fill="#475569">Many-to-many document_tags</text>
    <text x="850" y="585" font-size="10" fill="#475569">Browse by tag / topic</text>
  </g>

  <!-- Connect wiki outputs to user consumption -->
  <path d="M670 480 L125 525" stroke="#4a5568" stroke-width="1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <path d="M750 480 L125 525" stroke="#4a5568" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <path d="M860 480 L325 525" stroke="#4a5568" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <path d="M860 480 L525 525" stroke="#4a5568" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <path d="M860 480 L725 525" stroke="#4a5568" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <path d="M950 480 L955 525" stroke="#4a5568" stroke-width="1" fill="none" stroke-dasharray="3,3"/>

  <!-- ===== Core design insight ===== -->
  <g>
    <text x="240" y="410" font-size="12" font-weight="600" fill="#334155">Core design: Claude isn't a translator — it's a librarian</text>
    <text x="240" y="428" font-size="10" fill="#475569">It reads the source, writes wiki files, updates entity and topic pages, appends the log — the graph grows as you read</text>
  </g>
</svg>
